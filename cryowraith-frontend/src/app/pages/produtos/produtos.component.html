<div class="ft">
  <input [(ngModel)]="busca" (input)="aplicarFiltros()" placeholder="Buscar calçado...">
  <select [(ngModel)]="ordem" (change)="aplicarFiltros()">
    <option value="padrao">Ordenar</option>
    <option value="menor">Menor preço</option>
    <option value="maior">Maior preço</option>
  </select>
</div>

<section class="dst">
  <h2 class="stl">Todos os Calçados</h2>
  <div class="flt">
    <button *ngFor="let t of tipos" [class.on]="filtro === t" (click)="filtrar(t)">{{ t }}</button>
  </div>
  <div class="grd">
    <div class="cd" *ngFor="let p of produtos">
      <img [src]="p.imagem" [alt]="p.nome" loading="lazy">
      <div class="if">
        <div class="nm">{{ p.nome }}</div>
        <div class="ds">{{ p.descricao }}</div>
        <div class="pr">R$ {{ p.preco.toFixed(2) }}</div>
        <div class="sk">{{ p.estoque }} unid.</div>
        <div class="ba">
         <button (click)="verDetalhes(p)">Comprar agora</button>
       </div>
      </div>
    </div>
  </div>
</section>
